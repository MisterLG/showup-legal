<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowUp – Einladung</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5F1EB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1C1A16;
            margin-bottom: 8px;
        }
        p {
            font-size: 15px;
            color: #9A9285;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary {
            background: #2D4A3E;
            color: #fff;
            margin-bottom: 12px;
        }
        .btn-store {
            background: #F5F1EB;
            color: #2D4A3E;
            border: 1.5px solid #DED8CE;
        }
        .hint {
            font-size: 13px;
            color: #B5AFA5;
            margin-top: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎉</div>
        <h1 id="title">Du wurdest eingeladen!</h1>
        <p id="subtitle">Öffne ShowUp, um der Party beizutreten.</p>

        <a id="btn-open" class="btn btn-primary" href="#">In ShowUp öffnen</a>
        <a id="btn-store" class="btn btn-store" href="https://apps.apple.com/app/id6778236369" target="_blank">ShowUp im App Store laden</a>

        <p class="hint">Noch kein Account? Einfach App laden und loslegen.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const partyId = params.get('party');

        if (!partyId || !/^[a-zA-Z0-9_-]{1,64}$/.test(partyId)) {
            document.getElementById('title').textContent = 'Ungültige Einladung';
            document.getElementById('subtitle').textContent = 'Dieser Link ist leider nicht mehr gültig.';
            document.getElementById('btn-open').style.display = 'none';
        } else {
            const deepLink = 'showup://join/' + partyId;
            document.getElementById('btn-open').href = deepLink;

            // Party-ID in Zwischenablage legen – ShowUp liest sie beim ersten Start
            // (Fallback für Erstinstall: App-Store-Download → App öffnen → Party-ID gefunden)
            try {
                navigator.clipboard.writeText('showup-party:' + partyId).catch(() => {});
            } catch (e) {}

            // Automatisch versuchen, die App zu öffnen
            setTimeout(() => {
                window.location.href = deepLink;
            }, 300);
        }

        // "Im App Store laden"-Button: Party-ID auch per Legacy-Clipboard sichern
        document.getElementById('btn-store').addEventListener('click', () => {
            try {
                navigator.clipboard.writeText('showup-party:' + partyId).catch(() => {});
            } catch (e) {}
        });
    </script>
</body>
</html>
